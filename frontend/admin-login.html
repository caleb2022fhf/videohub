
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: #141414;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 30px;
}

.logo {
    text-align: center;
    color: #ff3c91;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 12px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 30px;
}

label {
    display: block;
    margin: 18px 0 9px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #333;
    background: #080808;
    color: white;
    outline: none;
}

input:focus {
    border-color: #ff3c91;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(90deg, #8134af, #dd2a7b);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#message {
    margin-top: 18px;
    text-align: center;
    color: #ffcc66;
    line-height: 1.5;
}

.back {
    display: block;
    text-align: center;
    color: white;
    text-decoration: none;
    margin-top: 22px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">VideoHub</div>

    <h2>Admin Login</h2>

    <p class="subtitle">Sign in to manage your videos.</p>

    <form id="loginForm">

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <p id="message"></p>

    <a class="back" href="index.html">← Back to Website</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";
    message.textContent = "";

    try {
        if (!window.supabaseClient) {
            throw new Error("Supabase connection is missing.");
        }

        const { data, error } =
            await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw error;
        }

        const { data: isAdmin, error: adminError } =
            await window.supabaseClient.rpc("claim_first_video_admin");

        if (adminError) {
            await window.supabaseClient.auth.signOut();
            throw adminError;
        }

        if (isAdmin !== true) {
            await window.supabaseClient.auth.signOut();
            throw new Error("You are not authorized to access the admin dashboard.");
        }

        message.textContent = "Login successful!";

        window.location.replace("admin.html");

    } catch (error) {
        message.textContent = error.message;
        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
});
</script>

</body>
</html>
