
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub Admin Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    border-bottom: 1px solid #252525;
}

.logo {
    color: #ff3c91;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
    margin-right: 15px;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.subtitle {
    color: #999;
    margin: 10px 0 30px;
}

.form {
    background: #141414;
    padding: 25px;
    border: 1px solid #292929;
    border-radius: 15px;
    margin-bottom: 40px;
}

label {
    display: block;
    margin: 20px 0 10px;
}

input, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #333;
    background: #080808;
    color: white;
    outline: none;
}

textarea {
    height: 100px;
    resize: vertical;
}

input:focus, textarea:focus {
    border-color: #ff3c91;
}

button {
    padding: 13px 17px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #8134af, #dd2a7b);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#logoutButton {
    background: #292929;
    margin: 0;
}

.preview {
    margin-top: 25px;
    display: none;
}

.preview iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 12px;
}

#message {
    margin-top: 15px;
    color: #ffcc66;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

#dashboardContent {
    display: none;
}

.videos-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.video-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

.video-card {
    background: #141414;
    border: 1px solid #292929;
    border-radius: 12px;
    overflow: hidden;
}

.video-card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: #222;
}

.video-details {
    padding: 16px;
}

.video-details h3 {
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.video-details p {
    color: #999;
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.video-link {
    display: block;
    color: #ff75b3;
    font-size: 12px;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

.status {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    background: #292929;
}

.status.published {
    color: #55e69a;
}

.status.unpublished {
    color: #ffcc66;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.actions button {
    flex: 1;
    min-width: 90px;
    margin: 0;
    font-size: 12px;
    padding: 10px;
}

.edit-button {
    background: #2858a5;
}

.toggle-button {
    background: #555;
}

.delete-button {
    background: #a52d42;
}

.empty {
    color: #999;
    text-align: center;
    padding: 35px;
    background: #141414;
    border-radius: 10px;
    grid-column: 1 / -1;
}

@media(max-width: 600px) {
    .container {
        padding: 15px;
    }

    header {
        padding: 15px;
    }

    .video-list {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">VideoHub</div>

    <div>
        <a href="index.html">← Back to Website</a>
        <button type="button" id="logoutButton">Logout</button>
    </div>
</header>

<div class="container" id="dashboardContent">

    <h1>Admin Dashboard</h1>
    <p class="subtitle">Add, edit, publish and manage your YouTube videos.</p>

    <div class="form">

        <h2>Add New Video</h2>

        <label for="title">Video Title</label>
        <input type="text" id="title" maxlength="200" placeholder="Enter video title">

        <label for="description">Description</label>
        <textarea id="description" maxlength="5000" placeholder="Describe your video"></textarea>

        <label for="youtubeUrl">YouTube Video Link</label>
        <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">

        <div class="preview" id="preview">
            <h3>Video Preview</h3>
            <iframe
                id="player"
                title="YouTube video preview"
                allowfullscreen
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        </div>

        <button type="button" id="previewButton">
            Preview Video
        </button>

        <button type="button" id="publishButton">
            Publish Video
        </button>

        <p id="message" role="status" aria-live="polite"></p>

    </div>

    <div class="videos-heading">
        <div>
            <h2>All Videos</h2>
            <p class="subtitle" id="videoCount">Loading videos...</p>
        </div>

        <button type="button" id="refreshButton">
            Refresh Videos
        </button>
    </div>

    <div class="video-list" id="videoList">
        <div class="empty">Loading videos...</div>
    </div>

</div>

<script>
const dashboard = document.getElementById("dashboardContent");
const message = document.getElementById("message");
const videoList = document.getElementById("videoList");
const videoCount = document.getElementById("videoCount");

const logoutButton = document.getElementById("logoutButton");
const publishButton = document.getElementById("publishButton");
const refreshButton = document.getElementById("refreshButton");

let allVideos = [];

async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
            ...(options.headers || {})
        }
    });

    const result = await response.json().catch(() => ({}));

    if (response.status === 401) {
        window.location.replace("admin-login.html");
        throw new Error("Your session has expired. Please login again.");
    }

    if (!response.ok) {
        let errorMessage =
            result.error ||
            result.message ||
            "Request failed.";

        if (result.diagnostic) {
            const d = result.diagnostic;

            errorMessage +=
                "\nHTTP Status: " + (d.httpStatus || "Unknown") +
                "\nError Code: " + (d.errorCode || "Unknown") +
                "\nDatabase Message: " + (d.message || "None") +
                "\nDetails: " + (d.details || "None") +
                "\nHint: " + (d.hint || "None") +
                "\nSolution: " + (d.solution || "Check database configuration.");
        }

        throw new Error(errorMessage);
    }

    return result;
}

async function checkAdminAccess() {
    dashboard.style.display = "none";

    try {
        const result = await apiRequest("/api/session");

        if (result.authenticated !== true) {
            window.location.replace("admin-login.html");
            return;
        }

        dashboard.style.display = "block";
        await loadVideos();

    } catch (error) {
        message.textContent = error.message;
    }
}

logoutButton.addEventListener("click", async function() {
    logoutButton.disabled = true;

    try {
        await apiRequest("/api/logout", {
            method: "POST"
        });

        window.location.replace("admin-login.html");

    } catch (error) {
        alert("Logout failed: " + error.message);
        logoutButton.disabled = false;
    }
});

function getYouTubeID(value) {
    try {
        const parsed = new URL(value.trim());

        if (parsed.protocol !== "https:") {
            return null;
        }

        let id = null;

        if (parsed.hostname === "youtu.be") {
            id = parsed.pathname.split("/")[1];

        } else if (
            [
                "youtube.com",
                "www.youtube.com",
                "m.youtube.com"
            ].includes(parsed.hostname)
        ) {
            if (parsed.pathname === "/watch") {
                id = parsed.searchParams.get("v");
            } else {
                const parts = parsed.pathname.split("/");

                if (["embed", "shorts", "live"].includes(parts[1])) {
                    id = parts[2];
                }
            }
        }

        return id && /^[a-zA-Z0-9_-]{11}$/.test(id)
            ? id
            : null;

    } catch {
        return null;
    }
}

function previewVideo() {
    const url = document.getElementById("youtubeUrl").value.trim();
    const id = getYouTubeID(url);

    if (!id) {
        message.textContent = "Enter a valid HTTPS YouTube video link.";
        return;
    }

    document.getElementById("player").src =
        "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id);

    document.getElementById("preview").style.display = "block";
    message.textContent = "Video preview is ready.";
}

async function publishVideo() {
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const url = document.getElementById("youtubeUrl").value.trim();

    if (!title || !getYouTubeID(url)) {
        message.textContent =
            "Enter a title and a valid HTTPS YouTube video link.";
        return;
    }

    publishButton.disabled = true;
    publishButton.textContent = "Publishing...";
    message.textContent = "";

    try {
        const result = await apiRequest("/api/videos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                description: description,
                youtube_url: url,
                published: true
            })
        });

        message.textContent =
            result.message || "YouTube link saved successfully.";

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        document.getElementById("youtubeUrl").value = "";
        document.getElementById("preview").style.display = "none";
        document.getElementById("player").src = "";

        await loadVideos();

    } catch (error) {
        message.textContent = "Publishing failed:\n" + error.message;

    } finally {
        publishButton.disabled = false;
        publishButton.textContent = "Publish Video";
    }
}

async function loadVideos() {
    videoList.innerHTML =
        '<div class="empty">Loading videos...</div>';

    refreshButton.disabled = true;

    try {
        const data = await apiRequest("/api/videos");

        allVideos = Array.isArray(data)
            ? data
            : Array.isArray(data.videos)
                ? data.videos
                : [];

        displayVideos();

    } catch (error) {
        videoList.innerHTML = "";

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Unable to load videos: " + error.message;

        videoList.appendChild(empty);

    } finally {
        refreshButton.disabled = false;
    }
}

function displayVideos() {
    videoList.replaceChildren();

    videoCount.textContent =
        allVideos.length + " video(s) in your database";

    if (allVideos.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No videos have been added yet.";

        videoList.appendChild(empty);
        return;
    }

    allVideos.forEach(function(video) {
        const card = document.createElement("div");
        card.className = "video-card";

        const image = document.createElement("img");
        const videoID = getYouTubeID(video.youtube_url || "");

        image.src = video.thumbnail_url ||
            (videoID
                ? "https://img.youtube.com/vi/" + videoID + "/hqdefault.jpg"
                : "");

        image.alt = video.title || "Video thumbnail";
        image.loading = "lazy";

        const details = document.createElement("div");
        details.className = "video-details";

        const title = document.createElement("h3");
        title.textContent = video.title || "Untitled Video";

        const description = document.createElement("p");
        description.textContent = video.description || "No description";

        const link = document.createElement("a");
        link.className = "video-link";
        link.href = video.youtube_url || "#";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open YouTube video";

        const status = document.createElement("span");
        status.className = video.published
            ? "status published"
            : "status unpublished";

        status.textContent = video.published
            ? "Published"
            : "Unpublished";

        const actions = document.createElement("div");
        actions.className = "actions";

        const editButton = document.createElement("button");
        editButton.className = "edit-button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => editVideo(video));

        const toggleButton = document.createElement("button");
        toggleButton.className = "toggle-button";
        toggleButton.textContent = video.published
            ? "Unpublish"
            : "Publish";
        toggleButton.addEventListener("click", () => togglePublish(video));

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteVideo(video));

        actions.appendChild(editButton);
        actions.appendChild(toggleButton);
        actions.appendChild(deleteButton);

        details.appendChild(title);
        details.appendChild(description);
        details.appendChild(link);
        details.appendChild(status);
        details.appendChild(actions);

        card.appendChild(image);
        card.appendChild(details);

        videoList.appendChild(card);
    });
}

async function editVideo(video) {
    const newTitle = prompt("Enter new video title:", video.title);

    if (newTitle === null) return;

    if (!newTitle.trim() || newTitle.trim().length > 200) {
        alert("Video title must contain 1 to 200 characters.");
        return;
    }

    const newDescription = prompt(
        "Enter new video description:",
        video.description || ""
    );

    if (newDescription === null) return;

    if (newDescription.length > 5000) {
        alert("Description cannot exceed 5000 characters.");
        return;
    }

    const newURL = prompt(
        "Enter new YouTube video URL:",
        video.youtube_url
    );

    if (newURL === null) return;

    if (!getYouTubeID(newURL.trim())) {
        alert("Please enter a valid HTTPS YouTube URL.");
        return;
    }

    try {
        await apiRequest("/api/videos", {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: video.id,
                title: newTitle.trim(),
                description: newDescription.trim(),
                youtube_url: newURL.trim()
            })
        });

        alert("Video updated successfully!");
        await loadVideos();

    } catch (error) {
        alert("Update failed:\n" + error.message);
    }
}

async function togglePublish(video) {
    const newStatus = !video.published;
    const action = newStatus ? "publish" : "unpublish";

    if (!confirm("Are you sure you want to " + action + " this video?")) {
        return;
    }

    try {
        await apiRequest("/api/videos", {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: video.id,
                published: newStatus
            })
        });

        await loadVideos();

    } catch (error) {
        alert("Status update failed:\n" + error.message);
    }
}

async function deleteVideo(video) {
    if (!confirm(
        'Are you sure you want to permanently delete "' +
        video.title + '"?'
    )) {
        return;
    }

    try {
        await apiRequest(
            "/api/videos?id=" + encodeURIComponent(video.id),
            { method: "DELETE" }
        );

        alert("Video deleted successfully!");
        await loadVideos();

    } catch (error) {
        alert("Delete failed:\n" + error.message);
    }
}

document.getElementById("previewButton")
    .addEventListener("click", previewVideo);

publishButton.addEventListener("click", publishVideo);
refreshButton.addEventListener("click", loadVideos);

checkAdminAccess();
</script>

</body>
</html>
