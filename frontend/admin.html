
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub Admin Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #252525;
}

.logo {
    color: #ff3c91;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 750px;
    margin: 45px auto;
    padding: 20px;
}

.subtitle {
    color: #999;
    margin: 10px 0 30px;
}

.form {
    background: #141414;
    padding: 25px;
    border: 1px solid #292929;
    border-radius: 15px;
}

label {
    display: block;
    margin: 20px 0 10px;
}

input, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #333;
    background: #080808;
    color: white;
    outline: none;
}

textarea {
    height: 100px;
    resize: vertical;
}

input:focus, textarea:focus {
    border-color: #ff3c91;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(90deg, #8134af, #dd2a7b);
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

.preview {
    margin-top: 25px;
    display: none;
}

.preview iframe {
    width: 100%;
    aspect-ratio: 16/9;
    border: none;
    border-radius: 12px;
}

#message {
    margin-top: 15px;
    color: #ffcc66;
}
</style>
</head>

<body>

<header>
    <div class="logo">VideoHub</div>
    <a href="index.html">← Back to Website</a>
</header>

<div class="container">

    <h1>Admin Dashboard</h1>
    <p class="subtitle">Add and manage your YouTube videos.</p>

    <div class="form">

        <h2>Add New Video</h2>

        <label>Video Title</label>
        <input type="text" id="title"
        placeholder="Enter video title">

        <label>Description</label>
        <textarea id="description"
        placeholder="Describe your video"></textarea>

        <label>YouTube Video Link</label>
        <input type="url" id="youtubeUrl"
        placeholder="https://www.youtube.com/watch?v=...">

        <div class="preview" id="preview">
            <h3>Video Preview</h3>
            <iframe id="player"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        </div>

        <button onclick="previewVideo()">
            Preview Video
        </button>

        <button onclick="publishVideo()">
            Publish Video
        </button>

        <p id="message"></p>

    </div>
</div>

<script>
function getYouTubeID(url) {
    try {
        const parsed = new URL(url);

        if (parsed.hostname === "youtu.be") {
            return parsed.pathname.split("/")[1];
        }

        if (
            parsed.hostname === "youtube.com" ||
            parsed.hostname === "www.youtube.com" ||
            parsed.hostname === "m.youtube.com"
        ) {
            if (parsed.pathname === "/watch") {
                return parsed.searchParams.get("v");
            }

            const parts = parsed.pathname.split("/");

            if (["embed", "shorts"].includes(parts[1])) {
                return parts[2];
            }
        }
    } catch (error) {
        return null;
    }

    return null;
}

function previewVideo() {
    const url = document.getElementById("youtubeUrl").value.trim();
    const id = getYouTubeID(url);
    const message = document.getElementById("message");

    if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) {
        message.textContent = "Enter a valid YouTube video link.";
        return;
    }

    document.getElementById("player").src =
        "https://www.youtube.com/embed/" + id;

    document.getElementById("preview").style.display = "block";

    message.textContent = "Video preview is ready.";
}

function publishVideo() {
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const url = document.getElementById("youtubeUrl").value.trim();
    const id = getYouTubeID(url);

    const message = document.getElementById("message");

    if (!title || !id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) {
        message.textContent =
            "Enter a title and a valid YouTube video link.";
        return;
    }

    message.textContent =
        "Your video details are ready. Database connection is coming next.";
}
</script>

</body>
</html>
