
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub Admin Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #252525;
}

.logo {
    color: #ff3c91;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
}

#logoutButton {
    width: auto;
    padding: 10px 18px;
    margin: 0;
    background: #292929;
}

.container {
    max-width: 750px;
    margin: 45px auto;
    padding: 20px;
}

.subtitle {
    color: #999;
    margin: 10px 0 30px;
}

.form {
    background: #141414;
    padding: 25px;
    border: 1px solid #292929;
    border-radius: 15px;
}

label {
    display: block;
    margin: 20px 0 10px;
}

input, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #333;
    background: #080808;
    color: white;
    outline: none;
}

textarea {
    height: 100px;
    resize: vertical;
}

input:focus, textarea:focus {
    border-color: #ff3c91;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(90deg, #8134af, #dd2a7b);
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.preview {
    margin-top: 25px;
    display: none;
}

.preview iframe {
    width: 100%;
    aspect-ratio: 16/9;
    border: none;
    border-radius: 12px;
}

#message {
    margin-top: 15px;
    color: #ffcc66;
    line-height: 1.5;
}

#dashboardContent {
    display: none;
}
</style>
</head>

<body>

<header>
    <div class="logo">VideoHub</div>
    <div>
        <a href="index.html">← Back to Website</a>
        <button type="button" id="logoutButton">Logout</button>
    </div>
</header>

<div class="container" id="dashboardContent">

    <h1>Admin Dashboard</h1>
    <p class="subtitle">Add and manage your YouTube videos.</p>

    <div class="form">

        <h2>Add New Video</h2>

        <label>Video Title</label>
        <input type="text" id="title" placeholder="Enter video title">

        <label>Description</label>
        <textarea id="description" placeholder="Describe your video"></textarea>

        <label>YouTube Video Link</label>
        <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">

        <div class="preview" id="preview">
            <h3>Video Preview</h3>
            <iframe id="player" allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        </div>

        <button type="button" id="previewButton">
            Preview Video
        </button>

        <button type="button" id="publishButton">
            Publish Video
        </button>

        <p id="message"></p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const dashboard = document.getElementById("dashboardContent");
const message = document.getElementById("message");
const logoutButton = document.getElementById("logoutButton");

async function checkAdminAccess() {
    dashboard.style.display = "none";

    if (!window.supabaseClient) {
        message.textContent = "Supabase connection is missing.";
        return;
    }

    try {
        const { data: { session }, error } =
            await window.supabaseClient.auth.getSession();

        if (error || !session) {
            window.location.replace("admin-login.html");
            return;
        }

        const { data: isAdmin, error: adminError } =
            await window.supabaseClient.rpc("is_video_admin");

        if (adminError || isAdmin !== true) {
            await window.supabaseClient.auth.signOut();
            window.location.replace("admin-login.html");
            return;
        }

        dashboard.style.display = "block";

    } catch (error) {
        message.textContent = "Could not verify admin access.";
    }
}

logoutButton.addEventListener("click", async function() {
    await window.supabaseClient.auth.signOut();
    window.location.replace("admin-login.html");
});

function getYouTubeID(url) {
    try {
        const parsed = new URL(url);
        let id = null;

        if (parsed.hostname === "youtu.be") {
            id = parsed.pathname.split("/")[1];
        } else if (
            ["youtube.com", "www.youtube.com", "m.youtube.com"].includes(parsed.hostname)
        ) {
            if (parsed.pathname === "/watch") {
                id = parsed.searchParams.get("v");
            } else {
                const parts = parsed.pathname.split("/");
                if (["embed", "shorts"].includes(parts[1])) {
                    id = parts[2];
                }
            }
        }

        return id && /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;

    } catch (error) {
        return null;
    }
}

function previewVideo() {
    const url = document.getElementById("youtubeUrl").value.trim();
    const id = getYouTubeID(url);

    if (!id) {
        message.textContent = "Enter a valid YouTube video link.";
        return;
    }

    document.getElementById("player").src =
        "https://www.youtube.com/embed/" + id;

    document.getElementById("preview").style.display = "block";
    message.textContent = "Video preview is ready.";
}

async function publishVideo() {
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const url = document.getElementById("youtubeUrl").value.trim();
    const id = getYouTubeID(url);

    const button = document.getElementById("publishButton");

    if (!title || !id) {
        message.textContent = "Enter a title and a valid YouTube video link.";
        return;
    }

    button.disabled = true;
    button.textContent = "Publishing...";
    message.textContent = "";

    const thumbnail = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";

    try {
        const { data: { session } } =
            await window.supabaseClient.auth.getSession();

        if (!session) {
            window.location.replace("admin-login.html");
            return;
        }

        const { data: isAdmin, error: adminError } =
            await window.supabaseClient.rpc("is_video_admin");

        if (adminError || isAdmin !== true) {
            throw new Error("You are not authorized to publish videos.");
        }

        const { error } = await window.supabaseClient
            .from("videos")
            .insert([{
                title: title,
                description: description,
                youtube_url: url,
                thumbnail_url: thumbnail,
                published: true
            }]);

        if (error) {
            throw error;
        }

        message.textContent = "Video published successfully!";

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        document.getElementById("youtubeUrl").value = "";
        document.getElementById("preview").style.display = "none";
        document.getElementById("player").src = "";

    } catch (error) {
        message.textContent = "Publishing failed: " + error.message;
    } finally {
        button.disabled = false;
        button.textContent = "Publish Video";
    }
}

document.getElementById("previewButton").addEventListener("click", previewVideo);
document.getElementById("publishButton").addEventListener("click", publishVideo);

checkAdminAccess();
</script>

</body>
</html>
